<style>
/* Mise en page : une colonne large de 1240px, grille 12 colonnes, grands titres serrés,
   le rose de la rue comme seul accent. Les projets portent leur propre couleur. */
:root{
  --paper:#f2f3f1; --card:#ffffff; --ink:#0f1013; --mute:#62656c; --line:#d7d9d5; --accent:#ff2d78; --accent-ink:#ffffff;
  --display:'Bricolage Grotesque','Arial Narrow',Arial,sans-serif;
  --body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --w:1240px; --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0c0c0f;--card:#15151a;--ink:#f3f2ee;--mute:#9b9da5;--line:#27282e;--accent:#ff3d84;--accent-ink:#0c0c0f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0c0c0f;--card:#15151a;--ink:#f3f2ee;--mute:#9b9da5;--line:#27282e;--accent:#ff3d84;--accent-ink:#0c0c0f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 28px}
.mono{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{font:800 20px/1 var(--display);letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;align-items:center;gap:4px}
nav a{padding:8px 12px;border-radius:999px;font-weight:500;font-size:15px;color:var(--mute);transition:color .15s,background .15s}
nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;border:0;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pink{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
nav .btn{padding:9px 16px;color:var(--paper);margin-left:8px}
nav .btn:hover{background:var(--ink);color:var(--paper)}

/* accueil */
.hero{padding:72px 0 56px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:end}
.hero h1{font-size:clamp(64px,12.5vw,184px);line-height:.82;letter-spacing:-.055em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:clamp(18px,1.6vw,22px);line-height:1.45;max-width:30em;margin-top:28px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.ways{border-top:1.5px solid var(--ink)}
.ways a{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:baseline;padding:18px 2px;border-bottom:1px solid var(--line);transition:padding .2s}
.ways a:hover{padding-left:10px}
.ways b{font:800 clamp(24px,2.6vw,34px)/1 var(--display);letter-spacing:-.03em}
.ways span.d{display:block;color:var(--mute);font-size:15px;margin-top:6px}
.ways .n{font:500 13px var(--mono);color:var(--mute)}
.ways .go{font-size:22px;color:var(--accent)}

section{padding:56px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.sh h2{font-size:clamp(36px,5vw,68px)}
.sh p{max-width:34em;color:var(--mute)}

/* le projet 3D mis en avant */
.lab{position:relative;display:block;border-radius:calc(var(--r) + 6px);overflow:hidden;background:#07060b;color:#fff;isolation:isolate}
.lab img{width:100%;aspect-ratio:16/8;object-fit:cover;object-position:50% 58%;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.lab:hover img{transform:scale(1.035)}
.lab::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,6,11,.92) 0%,rgba(7,6,11,.55) 38%,rgba(7,6,11,0) 68%),linear-gradient(0deg,rgba(7,6,11,.7),rgba(7,6,11,0) 40%);z-index:1}
.lab .in{position:absolute;inset:0;z-index:2;padding:clamp(22px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;max-width:620px}
.lab .mono{color:#ff8fb8}
.lab h3{font-size:clamp(40px,6.4vw,92px);text-shadow:0 0 34px rgba(255,45,120,.55)}
.lab p{color:rgba(255,255,255,.82);margin:16px 0 22px;max-width:28em}
.lab .meta{display:flex;gap:18px;flex-wrap:wrap;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:18px}
.labnote{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:15px}

/* projets */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.pj{grid-column:span 4;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .25s,box-shadow .25s}
.pj:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--ink),0 18px 40px -18px rgba(0,0,0,.35)}
.pj.big{grid-column:span 8}
.pj.half{grid-column:span 6}
.pj .vis{position:relative;aspect-ratio:4/3;background:var(--c0);color:var(--c1);overflow:hidden}
.pj.big .vis{aspect-ratio:16/9}
.pj.half .vis{aspect-ratio:16/10}
.pj .vis img{width:100%;height:100%;object-fit:cover}
.pj .vis .type{position:absolute;inset:0;display:flex;align-items:flex-end;padding:22px;font:800 clamp(34px,4.2vw,62px)/.88 var(--display);letter-spacing:-.045em}
.pj .vis .type::before{content:'';position:absolute;right:-12%;top:-30%;width:70%;aspect-ratio:1;border-radius:50%;background:var(--c1);opacity:.16}
.pj .tx{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px}
.pj .tx h3{font-size:24px;letter-spacing:-.025em;line-height:1.05}
.pj .tx p{color:var(--mute);font-size:15.5px;line-height:1.45}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tag{font:500 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}

/* apps */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.app{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:var(--r);background:var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .25s,box-shadow .25s}
.app:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--ink),0 18px 40px -18px rgba(0,0,0,.35)}
.stage{border-radius:12px;background:var(--c0);padding:26px 0 0;display:flex;justify-content:center;overflow:hidden;aspect-ratio:1/1.02}
.phone{width:62%;border-radius:22px 22px 0 0;background:#0b0b0e;padding:8px 8px 0;box-shadow:0 20px 40px -10px rgba(0,0,0,.5)}
.phone .scr{height:100%;border-radius:15px 15px 0 0;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 55%,#0b0b0e),#0b0b0e 75%);padding:18px 12px;display:flex;flex-direction:column;gap:9px;color:#fff}
.phone .scr b{font:800 17px/1 var(--display);letter-spacing:-.02em}
.phone .scr i{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.16)}
.phone .scr i.t{height:46px;border-radius:10px;background:color-mix(in srgb,var(--c1) 70%,transparent)}
.phone .scr small{margin-top:auto;padding-bottom:10px;font:400 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.app h3{font-size:24px;letter-spacing:-.025em}
.app p{color:var(--mute);font-size:15.5px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font:500 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--line)}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dot,var(--mute))}
.pill.on{--dot:#1fbf75}.pill.test{--dot:#f0a020}.pill.pre{--dot:#8a8d94}

.clients{display:flex;flex-wrap:wrap;gap:6px 26px;font:800 clamp(22px,3vw,40px)/1.12 var(--display);letter-spacing:-.03em}
.clients span:nth-child(3n+2){color:var(--mute)}
.about{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:start}
.about img{border-radius:var(--r);filter:grayscale(1) contrast(1.05);aspect-ratio:4/5;object-fit:cover;width:100%;background:var(--line)}
.about .bio{font:600 clamp(22px,2.5vw,32px)/1.25 var(--display);letter-spacing:-.02em;max-width:24em}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:36px;border-top:1.5px solid var(--ink);padding-top:20px}
.skills h4{margin:0 0 10px;font:800 20px var(--display);letter-spacing:-.02em}
.skills ul{list-style:none;margin:0;padding:0;color:var(--mute);font-size:15.5px;line-height:1.7}
footer{border-top:1px solid var(--line);margin-top:40px;padding:56px 0 64px}

footer .fl a:hover{color:var(--ink)}

/* pages de détail */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--mute);font-weight:500;margin:36px 0 26px}
.back:hover{color:var(--ink)}
.dh{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:40px;align-items:end;padding-bottom:36px;border-bottom:1.5px solid var(--ink)}
.dh h1{font-size:clamp(52px,9vw,132px);letter-spacing:-.05em;line-height:.86;margin-top:14px}
.dh .lede{font-size:clamp(19px,1.8vw,24px);line-height:1.4}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:30px 0 44px}
.facts h4{margin:0 0 8px}
.facts p{font-size:16px;line-height:1.5}
.media{display:grid;gap:18px}
.media .wide{width:100%;border-radius:var(--r)}.vids{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;background:var(--c0);border-radius:var(--r);padding:clamp(16px,3vw,36px)}.vids video{max-height:74vh;max-width:100%;width:auto;border-radius:12px;background:#000;min-width:0;flex:0 1 auto}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.gal img{width:100%;border-radius:var(--r);background:var(--line)}
.empty{border-radius:var(--r);background:var(--c0);color:var(--c1);padding:clamp(28px,6vw,80px);font:800 clamp(40px,8vw,120px)/.86 var(--display);letter-spacing:-.05em;min-height:320px;display:flex;align-items:flex-end}
.note{color:var(--mute);font-size:15px;margin-top:10px}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;border-radius:var(--r);background:var(--c0);padding:36px 36px 0;overflow:hidden}
.shots .phone{width:100%;aspect-ratio:9/15}
.next{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-top:56px;padding:28px 0;border-top:1px solid var(--line);font:800 clamp(28px,4.5vw,60px)/1 var(--display);letter-spacing:-.04em}
.next:hover span:last-child{color:var(--accent)}

@media (max-width:900px){
  .hero,.about,.dh{grid-template-columns:1fr;gap:32px}.hero{padding:44px 0 32px}
  .pj,.pj.big,.pj.half{grid-column:span 6}.apps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts,.skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lab img{aspect-ratio:4/5}.lab::after{background:linear-gradient(0deg,rgba(7,6,11,.95) 0%,rgba(7,6,11,.5) 55%,rgba(7,6,11,.1) 100%)}.lab .in{justify-content:flex-end;gap:14px}
  nav a:not(.btn){display:none}
}
@media (max-width:560px){
  .wrap{padding:0 18px}.pj,.pj.big,.pj.half{grid-column:span 12}.apps{grid-template-columns:1fr}.gal,.shots{grid-template-columns:1fr}.shots{padding:22px 22px 0}.shots .phone:nth-child(n+2){display:none}
  section{padding:40px 0}
}
</style>

  document.querySelectorAll('video[data-a]').forEach(v=>{const k=v.dataset.a,b=get(k);if(!b||v.src)return;
    if(!vurl[k]){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);vurl[k]=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));}
    v.src=vurl[k];});
}
['martell','tessan','lpt','gary'].forEach(n=>import(MEDIA+n+'.js').then(m=>{A[n]=m.default;hydrate();}).catch(()=>{}));

/* ---------- gabarits ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pal=p=>`style="--c0:${p.pal[0]};--c1:${p.pal[1]}"`;
const phone=(a,lbl)=>`<div class="phone"><div class="scr"><b>${esc(a.title)}</b><i class="t"></i><i></i><i style="width:70%"></i><i style="width:45%"></i><small>${lbl}</small></div></div>`;

function home(){
  const lab=LABS[0];
  return `<div class="wrap">
  <div class="hero">
    <div>
      <p class="mono">Portfolio · Paris</p>
      <h1>Design<br><em>&amp;</em> Code</h1>
      <p class="lede">Je suis Gary Le Grill, directeur artistique, motion designer et développeur. Je conçois des campagnes, des films et des interfaces, et je code les apps et les expériences 3D qui vont avec.</p>
      <div class="cta"><a class="btn pink" href="${lab.url}" ${HOSTED?'':'target="_blank" rel="noopener"'}>Entrer dans la rue en 3D <span aria-hidden="true">→</span></a><a class="btn ghost" href="#/" data-go="projets">Voir les projets</a></div>
    </div>
    <div class="ways">
      <a href="#/" data-go="projets"><span class="n">01</span><span><b>Design</b><span class="d">Direction artistique, campagnes, motion, films IA</span></span><span class="n">${PROJECTS.length} projets</span></a>
      <a href="#/" data-go="apps"><span class="n">02</span><span><b>Code</b><span class="d">Applications conçues, développées et publiées</span></span><span class="n">${APPS.length} apps</span></a>
      <a href="#/labo"><span class="n">03</span><span><b>Labo 3D</b><span class="d">Des univers à explorer comme un jeu</span></span><span class="n">${LABS.length} expérience</span></a>
    </div>
  </div>
  </div>

  <section id="labo"><div class="wrap">
    <a class="lab" href="${lab.url}" ${HOSTED?'':'target="_blank" rel="noopener"'} aria-label="Ouvrir ${esc(lab.title)}">
      <img src="${lab.img}" alt="Une rue de Paris la nuit en 3D : façades au néon, robots attablés en terrasse, pavés mouillés">
      <div class="in">
        <p class="mono">Labo 3D · ${lab.n} · projet à explorer</p>
        <div>
          <h3>${esc(lab.title)}</h3>
          <p>${esc(lab.line)}</p>
          <span class="btn pink">Entrer dans la rue <span aria-hidden="true">→</span></span>
          <div class="meta">${lab.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>
        </div>
      </div>
    </a>
    <div class="labnote"><span>Un projet personnel : mon univers, mes références et mes clients, version jeu vidéo.</span><a href="#/labo">Toutes les expériences 3D →</a></div>
  </div></section>

  <section id="projets"><div class="wrap">
    <div class="sh"><h2>Projets clients</h2><p>Direction artistique, motion et production assistée par IA, pour des marques et des agences.</p></div>
    <div class="grid">${PROJECTS.map(card).join('')}</div>
  </div></section>

  <section id="apps"><div class="wrap">
    <div class="sh"><h2>Mes apps</h2><p>Des produits que je conçois, que je code et que je mets en ligne moi-même.</p></div>
    <div class="apps">${APPS.map(a=>`<a class="app" href="#/apps/${a.slug}" ${pal(a)}>
      <div class="stage">${phone(a,'capture à venir')}</div>
      <div class="row"><h3>${esc(a.title)}</h3><span class="pill ${a.status[0]}">${a.status[1]}</span></div>
      <p>${esc(a.line)}</p></a>`).join('')}</div>
  </div></section>

  <section><div class="wrap">
    <p class="mono" style="margin-bottom:18px">Ils m'ont fait confiance</p>
    <div class="clients">${CLIENTS.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
  </div></section>

  <section id="apropos"><div class="wrap">
    <div class="about">
      <img data-a="gary" alt="Portrait de Gary Le Grill">
      <div>
        <p class="mono" style="margin-bottom:16px">À propos</p>
        <p class="bio">Plus de dix ans de direction artistique en indépendant, à Paris. Aujourd'hui je fais le design et le code du même projet, de la première idée à la mise en ligne.</p>
        <div class="skills">
          <div><h4>Design</h4><ul><li>Direction artistique</li><li>Identité et campagne</li><li>UI et UX</li></ul></div>
          <div><h4>Motion</h4><ul><li>Motion design</li><li>Film de marque</li><li>Montage</li></ul></div>
          <div><h4>Code</h4><ul><li>React</li><li>Three.js</li><li>Lovable, Bubble, Webflow</li><li>WordPress</li></ul></div>
          <div><h4>IA</h4><ul><li>Image générative</li><li>Vidéo générative</li><li>Chaînes de production</li></ul></div>
        </div>
      </div>
    </div>
  </div></section>`;
}
function card(p){
  const vis=p.cover?`<img data-a="${p.cover}" alt="Visuel du projet ${esc(p.title)}">`:`<div class="type">${esc(p.title)}</div>`;
  return `<a class="pj ${p.size||''}" href="#/projets/${p.slug}" ${pal(p)}><div class="vis">${vis}</div>
    <div class="tx"><div class="row"><span class="tag">${esc(p.brand)} · ${p.year}</span><span class="tag">${esc(p.tags)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.line)}</p></div></a>`;
}
const facts=p=>`<div class="facts"><div><h4 class="mono">Contexte</h4><p>${esc(p.ctx)}</p></div><div><h4 class="mono">Mon rôle</h4><p>${esc(p.role)}</p></div><div><h4 class="mono">Résultat</h4><p>${esc(p.out)}</p></div><div><h4 class="mono">Outils</h4><p>${esc(p.stack)}</p></div></div>`;
const nextOf=(L,p,base)=>{const n=L[(L.indexOf(p)+1)%L.length];return `<a class="next" href="#/${base}/${n.slug}"><span>Suivant</span><span>${esc(n.title)} →</span></a>`;};

function project(p){
  const media=[];
  const vids=[];if(p.video)vids.push(`<video data-a="${p.video}" controls playsinline preload="metadata" aria-label="Film du projet ${esc(p.title)}"></video>`);
  if(!p.video&&p.cover)media.push(`<img class="wide" data-a="${p.cover}" alt="Visuel principal du projet ${esc(p.title)}">`);
  if(p.loop)vids.push(`<video data-a="${p.loop}" autoplay muted loop playsinline aria-label="Key visual animé du projet ${esc(p.title)}"></video>`);
  if(vids.length)media.unshift(`<div class="vids">${vids.join('')}</div>`);
  if(p.gallery&&p.gallery.length)media.push(`<div class="gal">${p.gallery.map((g,i)=>`<img data-a="${g}" alt="${esc(p.title)}, visuel ${i+1}">`).join('')}</div>`);
  if(!media.length)media.push(`<div class="empty">${esc(p.title)}</div><p class="note">Les visuels de ce projet arrivent.</p>`);
  return `<div class="wrap" ${pal(p)}>
    <a class="back" href="#/" data-go="projets">← Tous les projets</a>
    <div class="dh"><div><p class="mono">${esc(p.brand)} · ${p.year} · ${esc(p.tags)}</p><h1>${esc(p.title)}</h1></div><p class="lede">${esc(p.line)}</p></div>
    ${facts(p)}
    <div class="media">${media.join('')}</div>
    ${nextOf(PROJECTS,p,'projets')}
  </div>`;
}
function app(a){
  return `<div class="wrap" ${pal(a)}>
    <a class="back" href="#/" data-go="apps">← Toutes les apps</a>
    <div class="dh"><div><p class="mono">${esc(a.brand)}</p><h1>${esc(a.title)}</h1></div>
      <div><p class="lede">${esc(a.line)}</p><p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pill ${a.status[0]}">${a.status[1]}</span><span class="tag">${esc(a.url)}</span></p></div></div>
    ${facts(a)}
    <div class="shots">${phone(a,'capture à venir')}${phone(a,'capture à venir')}${phone(a,'capture à venir')}</div>
    <p class="note">Emplacement des captures d'écran de l'app.</p>
    ${nextOf(APPS,a,'apps')}
  </div>`;
}
function labo(){
  return `<div class="wrap">
    <a class="back" href="#/">← Accueil</a>
    <div class="dh"><div><p class="mono">Labo 3D</p><h1>Des univers à explorer</h1></div><p class="lede">Des projets personnels en 3D temps réel, à parcourir comme un jeu. Chacun est une expérience à part, le labo s'agrandit au fil du temps.</p></div>
    <div style="display:grid;gap:22px;padding:36px 0">${LABS.map(l=>`<a class="lab" href="${l.url}" ${HOSTED?'':'target="_blank" rel="noopener"'}><img src="${l.img}" alt="Aperçu de l'expérience ${esc(l.title)}"><div class="in"><p class="mono">Expérience ${l.n}</p><div><h3>${esc(l.title)}</h3><p>${esc(l.line)}</p><span class="btn pink">Lancer <span aria-hidden="true">→</span></span><div class="meta">${l.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div></div></div></a>`).join('')}</div>
    <p class="note">Prochaine expérience : en préparation.</p>
  </div>`;
}

/* ---------- routeur ---------- */
const main=document.getElementById('app');let pending=null;
function render(){
  const [,a,b]=location.hash.replace(/^#/,'').split('/');let html,title='Gary Le Grill, Design et Code';
  const p=a==='projets'&&PROJECTS.find(x=>x.slug===b),ap=a==='apps'&&APPS.find(x=>x.slug===b);
  if(p){html=project(p);title=p.title+' · Gary Le Grill';}
  else if(ap){html=app(ap);title=ap.title+' · Gary Le Grill';}
  else if(a==='labo'){html=labo();title='Labo 3D · Gary Le Grill';}
  else html=home();
  main.innerHTML=html;document.title=title;hydrate();
  if(pending){const el=document.getElementById(pending);pending=null;if(el){el.scrollIntoView();return;}}
  scrollTo(0,0);
}
document.addEventListener('click',e=>{const l=e.target.closest('a[data-go]');if(!l)return;e.preventDefault();const id=l.dataset.go;
  if(document.getElementById(id)&&!location.hash.replace(/^#\/?/,'')){document.getElementById(id).scrollIntoView({behavior:'smooth'});return;}
  pending=id;if(location.hash==='#/'||location.hash==='')render();else location.hash='#/';});
addEventListener('hashchange',render);render();
</script>
